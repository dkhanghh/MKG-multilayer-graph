[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-llms-multilayer-graph"
version = "0.1.0"
description = "A knowledge graph construction pipeline using LangGraph for RAG applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Duy Khang", email = "huynhduykhang.t13cla@gmail.com"}
]
keywords = [
    "knowledge-graph",
    "llm",
    "langgraph",
    "rag",
    "nlp",
    "chatbot",
    "information-extraction"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core LangGraph dependencies
    "langgraph>=0.0.40",
    "langgraph-cli[inmem]>=0.4.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    # LangSmith tracing
    "langsmith>=0.1.0",
    "langchain>=0.1.0",
    # Document processing
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    # Machine Learning
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
    "ollama>=0.1.7",
    "google-genai>=1.36.0",
    "nltk>=3.8.0",
    # Data processing
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    # Configuration and utilities
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "jinja2>=3.0.0",
    # Web server dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    # Graph database support
    "neo4j>=5.0.0",
    # Evaluation dependencies
    "pymilvus>=2.6.2",
    "deepeval>=3.6.7",
    "datasets>=4.2.0",
    "ipywidgets>=8.1.7",
    "mcp[cli]>=1.25.0",
    "langchain-mcp-adapters>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.19.0",
]

all = [
    "thesis-llms-multilayer-graph[dev,test,docs]",
]

[project.urls]
Homepage = "https://github.com/duykhang2211/thesis-llms-multilayer-graph"
Repository = "https://github.com/duykhang2211/thesis-llms-multilayer-graph"
Issues = "https://github.com/duykhang2211/thesis-llms-multilayer-graph/issues"

[project.scripts]
kg-pipeline = "knowledge_graphs.cli:main"
chatbot = "chatbot_graphs.cli:main"

[tool.setuptools]
packages = ["knowledge_graphs", "chatbot_graphs", "agents", "utils"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=knowledge_graphs",
    "--cov=chatbot_graphs",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["knowledge_graphs", "chatbot_graphs", "agents", "utils"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain.*",
    "neo4j.*",
    "pymilvus.*",
    "deepeval.*",
]
ignore_missing_imports = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".pytest_cache",
    "*.egg-info",
]
per-file-ignores = [
    "__init__.py:F401",
]
