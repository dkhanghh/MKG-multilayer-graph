# KAG-LangGraph Pipeline Configuration with Jinja2 Templates
# This example shows how to use Jinja2 templates for LLM prompts

pipeline:
  name: "template_extraction_pipeline"
  description: "Knowledge extraction pipeline using Jinja2 templates"
  
  # Global settings
  settings:
    log_level: "INFO"
    max_workers: 4
    output_dir: "./output"

  # Pipeline components
  components:
    # Scanner: Discovers input files
    scanner:
      type: "file_scanner"
      enabled: true
      config:
        input_paths:
          - "./data"
        file_patterns:
          - "*.txt"
          - "*.pdf"
          - "*.docx"
        recursive: true
        max_files: 100

    # Reader: Extracts text from documents
    reader:
      type: "multi_format_reader"
      enabled: true
      config:
        chunk_size: 1000
        preserve_formatting: false

    # Splitter: Breaks text into manageable chunks
    splitter:
      type: "semantic_splitter"
      enabled: true
      config:
        chunk_size: 800
        chunk_overlap: 100
        split_method: "sentence"

    # Extractor: Extracts entities using Jinja2 templates
    extractor:
      type: "llm_extractor"
      enabled: true
      config:
        llm_provider: "openai"
        model: "gpt-3.5-turbo"
        api_key: "${OPENAI_API_KEY}"  # Environment variable reference
        temperature: 0.1
        max_tokens: 2000
        
        # Template configuration
        use_template: true
        template_name: "ner.md"  # Use the NER template
        
        # Entity and relation types (passed to template)
        entity_types:
          - "Person"
          - "Organization"
          - "Location"
          - "Concept"
          - "Medicine"
          - "Disease"
          - "Symptom"
          - "MedicalEquipment"
          - "SurgicalOperation"
        relation_types:
          - "works_for"
          - "located_in"
          - "related_to"
          - "part_of"
          - "treats"
          - "causes"
          - "used_for"
        
        batch_size: 5

    # Vectorizer: Creates embeddings for semantic search
    vectorizer:
      type: "embedding_vectorizer"
      enabled: true
      config:
        model_name: "all-MiniLM-L6-v2"
        batch_size: 32
        max_length: 512
        normalize_embeddings: true
        embed_nodes: true
        embed_edges: false
        node_text_template: "{name} is a {type}. {description}"
        edge_text_template: "{source} {relation} {target}"

    # Writer: Outputs the knowledge graph
    writer:
      type: "json_writer"
      enabled: true
      config:
        output_path: "./output/knowledge_graph_template.json"
        pretty_print: true
        include_metadata: true
        separate_files: false

# Alternative configuration for different domains
medical_pipeline:
  name: "medical_extraction_pipeline"
  description: "Medical knowledge extraction using specialized templates"
  
  components:
    extractor:
      type: "llm_extractor"
      enabled: true
      config:
        llm_provider: "openai"
        model: "gpt-4"
        api_key: "${OPENAI_API_KEY}"
        temperature: 0.05  # Lower temperature for medical accuracy
        max_tokens: 3000
        
        # Use template for medical domain
        use_template: true
        template_name: "ner.md"  # Could be "medical_ner.md" for specialized template
        
        # Medical-specific entity types
        entity_types:
          - "Disease"
          - "Symptom"
          - "Medicine"
          - "MedicalEquipment"
          - "SurgicalOperation"
          - "Anatomy"
          - "Dosage"
          - "Patient"
          - "Healthcare_Provider"
        relation_types:
          - "treats"
          - "causes"
          - "symptom_of"
          - "used_for"
          - "administered_to"
          - "located_in"
          - "part_of"
        
        batch_size: 3  # Smaller batches for complex medical text

# Configuration for custom template development
custom_template_pipeline:
  name: "custom_template_pipeline"
  description: "Pipeline using custom domain-specific templates"
  
  components:
    extractor:
      type: "llm_extractor"
      enabled: true
      config:
        llm_provider: "openai"
        model: "gpt-3.5-turbo"
        api_key: "${OPENAI_API_KEY}"
        
        # Custom template configuration
        use_template: true
        template_name: "custom_domain.md"  # Your custom template
        
        # Domain-specific configuration
        entity_types:
          - "CustomEntity1"
          - "CustomEntity2"
        relation_types:
          - "custom_relation"
        
        # Additional template variables can be passed here
        # These will be available in the template as {{ custom_variable }}
        custom_variable: "custom_value"
