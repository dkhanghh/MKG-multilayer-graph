version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./knowledge_graphs:/app/knowledge_graphs
      - ./output:/app/output
      - ./configs:/app/configs
    # Allow connecting to host services (like local Neo4j)
    # Use host.docker.internal to access host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
