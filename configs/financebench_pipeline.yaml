# FinanceBench Financial Statement Extraction Pipeline
# Uses 3-step extraction: NER → STD → TRP with SPG edge properties

pipeline:
  name: "financebench_extraction_pipeline"
  description: "FinanceBench financial statement extraction with Semantic Property Graph (SPG) schema"
  version: "1.0"

  # Global pipeline settings
  max_workers: 4
  batch_size: 10
  timeout: 3600  # 1 hour timeout

  # Global configuration
  global_config:
    log_level: "INFO"
    output_dir: "./output/financebench"

  # Component configurations
  components:
    # Scanner: Discover FinanceBench files
    scanner:
      type: "file_scanner"
      enabled: true
      config:
        input_paths:
          - "./data/financebench"
        file_patterns:
          - "financebench_id_*.txt"
        recursive: false
        max_files: 1
        skip_hidden: true

    # Reader: Parse FinanceBench format
    reader:
      type: "financebench_reader"
      enabled: true
      config:
        encoding: "utf-8"
        preserve_page_structure: true
        detect_statement_type: true
        extract_metadata: true

    # Splitter: Preserve page structure (optional - can skip if using page-based reader)
    splitter:
      type: "semantic_splitter"
      enabled: false  # Disabled since reader creates page-based chunks
      config:
        model_name: "jhu-clsp/mmBERT-small"
        similarity_threshold: 0.7
        min_chunk_length: 100
        max_chunk_length: 1000

    # Extractor: 3-step NER → STD → TRP extraction
    extractor:
      type: "llm_extractor"
      enabled: true
      config:
        # LLM Configuration
        llm_provider: "openai"  # Or "ollama"
        model: "gemini-2.5-flash"  # Or "gpt-4", "gpt-3.5-turbo"
        api_key: "${GOOGLE_API_KEY}"  # Environment variable
        base_url: "${GOOGLE_BASE_URL}"  # Optional: custom endpoint
        temperature: 0.1  # Low temperature for accuracy
        max_tokens: 10000  # Large context for financial data

        # Template Configuration
        use_template: true
        template_name: "ner.md"  # Uses NER → STD → TRP pipeline

        # Schema Configuration
        extraction_schema: "knowledge_graphs/schema/financebench_spg.yaml"  # SPG schema with edge properties

        # Extraction Mode
        extraction_mode: "multi_step"  # NER → STD → TRP
        extract_edge_properties: true  # Enable SPG edge property extraction

        # Batch Processing
        batch_size: 5  # Process 5 chunks in parallel

    # Vectorizer: Generate embeddings
    vectorizer:
      type: "gemini_vectorizer"  # Or "sentence_transformer_vectorizer"
      enabled: true
      config:
        model: "gemini-embedding-001"  # Or "all-MiniLM-L6-v2"
        embedding_dim: 768
        batch_size: 10
        embed_chunks: true  # Embed chunk content
        embed_entities: true  # Embed entity names/descriptions
        normalize_embeddings: true

    # Writer: Output to Neo4j
    writer:
      type: "neo4j_writer"
      enabled: true
      config:
        # Neo4j Connection
        uri: "${NEO4J_URI}"  # e.g., "bolt://localhost:7687"
        username: "${NEO4J_USERNAME}"  # e.g., "neo4j"
        password: "${NEO4J_PASSWORD}"
        database: "financebench1"  # Database name
        clear_database: false

        # Schema Configuration
        schema_file: "knowledge_graphs/schema/financebench_spg.yaml"  # SPG schema

        # SPG Settings
        enable_edge_properties: true  # Write edge properties to Neo4j
        collapse_financial_metrics: true  # Use SPG approach (edge properties)

        # Write Settings
        batch_size: 100
        create_indexes: true  # Create indexes for performance
        create_constraints: true  # Create uniqueness constraints

        # Optional: Export to JSON as well
        export_json: false
        json_output_path: "./output/financebench_graph.json"
